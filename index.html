<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitesh Prasad Badu - Personal Portfolio W</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brandDark: "#0a192f",
              brandDarkLight: "#112240",
            },
          },
        },
      };
    </script>
    <!-- Custom CSS File Link -->
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://kit.fontawesome.com/79fc14f2fb.js" crossorigin="anonymous"></script>
  </head>
  <body
    class="bg-gray-50 text-gray-900 dark:bg-brandDark dark:text-gray-100 transition-colors duration-300 min-h-screen pt-16"
  >
    <!-- NAVIGATION BAR -->
    <nav
      class="fixed top-0 left-0 w-full z-50 backdrop-blur-md bg-white/75 dark:bg-brandDark/75 border-b border-gray-200 dark:border-gray-800 transition-colors duration-300"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <!-- Logo -->
        <a
          href="#home"
          class="text-2xl font-bold tracking-wider text-blue-600 dark:text-cyan-400"
        >
          NPB.
        </a>

        <!-- Desktop Navigation Menu -->
        <div class="hidden md:flex items-center space-x-8">
          <a
            href="#home"
            class="hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
            >Home</a
          >
          <a
            href="#about"
            class="hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
            >About</a
          >
          <a
            href="#projects"
            class="hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
            >Projects</a
          >
          <a
            href="#skills"
            class="hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
            >Skills</a
          >
          <!-- <a
            href="#achievements"
            class="hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
            >Achievements</a
          > -->
          <a
            href="#contact"
            class="hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
            >Contact</a
          >

          <!-- Theme Toggle Button -->
          <button
            id="theme-toggle"
            class="p-2 rounded-lg bg-gray-100 dark:bg-brandDarkLight text-gray-700 dark:text-gray-300 hover:scale-105 transition-transform"
            aria-label="Toggle Theme"
          >
            <svg
              id="sun-icon"
              class="w-5 h-5 hidden dark:block text-yellow-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707m2.828 5.657a4 4 0 118 0 4 4 0 01-8 0z"
              ></path>
            </svg>
            <svg
              id="moon-icon"
              class="w-5 h-5 block dark:hidden text-gray-700"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              ></path>
            </svg>
          </button>

          <!-- Resume Button pointing to assets/documents/ -->
          <a
            href="assets/documents/resume.pdf"
            download
            class="px-4 py-2 border border-blue-600 dark:border-cyan-400 text-blue-600 dark:text-cyan-400 font-medium rounded hover:bg-blue-600/10 dark:hover:bg-cyan-400/10 transition-colors"
          >
            Resume
          </a>
        </div>

        <!-- Mobile Menu Top Controls -->
        <div class="md:hidden flex items-center space-x-4">
          <button
            id="theme-toggle-mobile"
            class="p-2 rounded-lg bg-gray-100 dark:bg-brandDarkLight text-gray-700 dark:text-gray-300"
          >
            <svg
              class="w-5 h-5 hidden dark:block text-yellow-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707m2.828 5.657a4 4 0 118 0 4 4 0 01-8 0z"
              ></path>
            </svg>
            <svg
              class="w-5 h-5 block dark:hidden text-gray-700"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              ></path>
            </svg>
          </button>
          <button
            id="mobile-menu-btn"
            class="text-gray-700 dark:text-gray-300 focus:outline-none"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Drawer Menu -->
      <div
        id="mobile-menu"
        class="hidden md:hidden bg-white dark:bg-brandDark border-b border-gray-200 dark:border-gray-800 px-6 py-4 space-y-3"
      >
        <a
          href="#home"
          class="block text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
          >Home</a
        >
        <a
          href="#about"
          class="block text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
          >About</a
        >
        <a
          href="#projects"
          class="block text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
          >Projects</a
        >
        <a
          href="#skills"
          class="block text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
          >Skills</a
        >
        <a
          href="#achievements"
          class="block text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
          >Achievements</a
        >
        <a
          href="#contact"
          class="block text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-cyan-400 transition-colors"
          >Contact</a
        >
        <a
          href="assets/documents/resume.pdf"
          download
          class="block text-center px-4 py-2 border border-blue-600 dark:border-cyan-400 text-blue-600 dark:text-cyan-400 font-medium rounded hover:bg-blue-600/10 dark:hover:bg-cyan-400/10 transition-colors"
        >
          Resume
        </a>
      </div>
    </nav>

    <!-- Testing viewports -->
    <section id="home" class="h-screen flex items-center justify-center">
      <h1 class="text-3xl font-bold">Home Section Content</h1>
    </section>

    <!-- Project Logic Initialization Scripts -->
    <script src="js/app.js"></script>
    <script src="js/navbar.js"></script>
  </body>
</html>
